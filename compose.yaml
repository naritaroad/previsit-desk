# Local development: `docker compose up -d db` starts PostgreSQL on 127.0.0.1:${POSTGRES_PORT:-5433}.
# The `api` service below is opt-in (profile "app") for trying the production image locally.
# Production uses deploy/compose.prod.yaml (see DEPLOY.md), never this file.
services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-previsit}
      POSTGRES_USER: ${POSTGRES_USER:-previsit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-previsit} -d ${POSTGRES_DB:-previsit}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: run the real image locally against the dev database before shipping it.
  #   docker compose --profile app up --build api      (needs a working Dockerfile and a built web/ and backend/)
  # Not started by `docker compose up -d db`. Production does not use this file (see deploy/compose.prod.yaml).
  api:
    profiles: ["app"]
    build:
      context: .
    image: previsit-desk:local-compose
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is db:5432, not the 127.0.0.1:5433 of .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-previsit}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-previsit}
      BIND_ADDR: 0.0.0.0:8088
      WEB_DIR: /app/web
      DATA_DIR: /app/data
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8088"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
