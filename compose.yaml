# Local development database only. Production uses deploy/compose.prod.yaml (see DEPLOY.md).
# `docker compose up -d db` starts PostgreSQL on 127.0.0.1:${POSTGRES_PORT:-5433}.
services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-previsit}
      POSTGRES_USER: ${POSTGRES_USER:-previsit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-previsit} -d ${POSTGRES_DB:-previsit}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
