<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches the header surface (--color-surface) so the status bar and header read as one bar. -->
    <meta name="theme-color" content="#fffdf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a201f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Replaced with the translated title once the language file is applied (src/i18n). -->
    <title>PreVisit Desk</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("pv-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          // Same colours as --color-surface in tokens.css, so the bar matches before the CSS is read.
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) {
            metas[i].removeAttribute("media");
            metas[i].setAttribute("content", t === "dark" ? "#1a201f" : "#fffdf9");
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
