<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Same values as --surface in src/styles/tokens.css: the status bar continues the page header. -->
    <meta name="theme-color" content="#fdfefd" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Replaced with the translated title once the language files are applied (src/i18n). -->
    <title>PreVisit Desk</title>
    <script>
      // Resolve theme and text size before first paint. The server hashes this script for the CSP.
      (function () {
        var d = document.documentElement, t = null, s = null;
        try {
          t = localStorage.getItem("pv-theme");
          s = localStorage.getItem("pv-text");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.theme = t;
        if (s === "112" || s === "125") d.dataset.text = s;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && t === "dark") m.setAttribute("content", "#161c18");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
